<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Color palette:
       dark: #0f4d2e, mid: #1f7a3e, light: #66b26b, bg: #fbf6ef -->
  <defs>
    <style type="text/css">
      .bg { fill: #fbf6ef; }
      .ring { fill: none; stroke: #0f4d2e; stroke-width: 26; }
      .hill-dark { fill: #0f4d2e; }
      .hill-mid { fill: #1f7a3e; }
      .hill-light { fill: #66b26b; }
      .house-fill { fill: #fbf6ef; stroke: #0f4d2e; stroke-width: 14; stroke-linejoin: round; }
      .roof { fill: #1f7a3e; stroke: #0f4d2e; stroke-width: 14; stroke-linejoin: round; }
      .tree-trunk { fill: #0f4d2e; }
      .tree-leaf { fill: #1f7a3e; stroke: #0f4d2e; stroke-width: 10; stroke-linejoin: round; }
      .sun-arc { fill: none; stroke: #66b26b; stroke-width: 18; stroke-linecap: round; }
      .text-main { font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; font-weight: 800; fill: #0f4d2e; font-size: 86px; letter-spacing: 6px; }
      .text-sub { font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; font-weight: 600; fill: #1f7a3e; font-size: 44px; letter-spacing: 8px; }
    </style>
    <!-- Optional rounded mask for crisp circle crop -->
    <clipPath id="circleClip">
      <circle cx="500" cy="340" r="320"></circle>
    </clipPath>
  </defs>

  <!-- background -->
  <rect class="bg" width="100%" height="100%"></rect>

  <!-- Outer circular emblem -->
  <g transform="translate(0,0)">
    <circle cx="500" cy="340" r="340" fill="none" stroke="#0f4d2e" stroke-width="22"></circle>
    <!-- main interior group clipped in the circle -->
    <g clip-path="url(#circleClip)">
      <!-- hills (layered) -->
      <path class="hill-dark" d="M0,740 C180,640 260,680 420,660 C520,648 640,730 1000,680 L1000,1000 L0,1000 Z"></path>
      <path class="hill-mid" d="M0,720 C170,630 310,700 470,680 C620,664 760,720 1000,690 L1000,1000 L0,1000 Z"></path>
      <path class="hill-light" d="M0,660 C170,560 330,610 480,590 C610,575 760,620 1000,600 L1000,1000 L0,1000 Z"></path>

      <!-- house -->
      <g transform="translate(250,210) scale(1)">
        <!-- house base -->
        <rect x="160" y="170" width="160" height="120" class="house-fill" rx="6" ry="6"></rect>
        <!-- roof -->
        <path d="M140 170 L240 90 L360 170 Z" class="roof"></path>
        <!-- door -->
        <rect x="210" y="200" width="40" height="90" fill="#1f7a3e" stroke="#0f4d2e" stroke-width="8" rx="3"></rect>
        <!-- small window -->
        <rect x="310" y="200" width="28" height="28" class="house-fill"></rect>
      </g>

      <!-- trees on right -->
      <g transform="translate(560,180)">
        <!-- big tree -->
        <rect class="tree-trunk" x="88" y="200" width="20" height="90" rx="4"></rect>
        <ellipse class="tree-leaf" cx="98" cy="160" rx="62" ry="100"></ellipse>
        <!-- small tree -->
        <rect class="tree-trunk" x="20" y="220" width="16" height="70" rx="3"></rect>
        <ellipse class="tree-leaf" cx="28" cy="190" rx="36" ry="68"></ellipse>
      </g>

      <!-- sun arc -->
      <path class="sun-arc" d="M320 120 C380 60 620 60 680 120"></path>

      <!-- subtle foreground curve to integrate house base -->
      <path d="M0,760 C220,700 320,720 500,700 C700,680 820,720 1000,700" fill="none" stroke="#0f4d2e" stroke-width="10" stroke-linecap="round"></path>
    </g>
  </g>

  <!-- Text under emblem -->
  <g transform="translate(0,0)">
    <text class="text-main" x="500" y="860" text-anchor="middle">NATUREPEAK</text>
    <text class="text-sub" x="500" y="915" text-anchor="middle">REAL ESTATE</text>
  </g>

  <!-- Accessibility title -->
  <title>NaturePeak — Green Real Estate Logo</title>
</svg>
